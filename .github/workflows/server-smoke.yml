name: Server Smoke

on:
  workflow_dispatch:
  schedule:
    # Weekly, so a Paper/Purpur API change or a broken shaded jar is noticed
    # even when nobody touched the plugin.
    - cron: '0 4 * * 1'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: server-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Boot Purpur and drive the console
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build plugin jar
        run: ./gradlew jar --console=plain

      - name: Boot server and run console commands
        run: bun run smoke:server

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-server-log
          path: build/smoke-server/server.log
          if-no-files-found: warn
