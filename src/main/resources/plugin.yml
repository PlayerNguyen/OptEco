name: OptEco
version: @VERSION@
api-version: 1.13
description: "The powerful points system plugin of Minecraft Server"
main: me.playernguyen.opteco.OptEco
author: Player_Nguyen
loadbefore: [ BossShopPro ]
softdepend: [ PlaceholderAPI, BossShopPro, MVdWPlaceholderAPI, ShopGUIPlus ]
commands:
  opteco:
    usage: /opteco help
    description: Command of the OptEco plugin
    aliases: [ points, pts, p ]
permissions:
  opteco.admin:
    description: Grant access to administrator commands
    default: op
    children:
      opteco.take: true
      opteco.add: true
      opteco.check: true
      opteco.reload: true
      opteco.set: true
      opteco.me: true
      opteco.top: true
      opteco.confirm: true
      opteco.cancel: true
      opteco.pay: true
  opteco.user:
    description: Grant access to player commands
    default: true
    children:
      opteco.me: true
      opteco.top: true
      opteco.check: true
      opteco.confirm: true
      opteco.cancel: true
      opteco.pay: true
  opteco.take:
    description: Grant access to /points take
    default: op
  opteco.add:
    description: Grant access to /points add
    default: op
  opteco.check:
    description: Grant access to /points check
    default: op
  opteco.me:
    description: Grant access to /points me
    default: true
  opteco.pay:
    description: Grant access to /points pay
    default: true
  opteco.reload:
    description: Grant access to /points reload
    default: op
  opteco.set:
    description: Grant access to /points set
    default: op
  opteco.confirm:
    description: Grant access to /points confirm
    default: true
  opteco.cancel:
    description: Grant access to /points cancel
    default: true
  opteco.top:
    description: Grant access to /points top
    default: true
