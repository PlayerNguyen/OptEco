/*
 * This file was generated by the Gradle 'init' task.
 */
import com.github.spotbugs.snom.SpotBugsTask
import com.undefinedcreations.runServer.RamAmount
import com.undefinedcreations.runServer.RunServerTask
import com.undefinedcreations.runServer.ServerType
import org.apache.tools.ant.filters.ReplaceTokens

plugins {
    id 'java'
    id 'maven-publish'
    id 'java-library'
    id 'com.github.spotbugs' version '6.5.13'
    id 'com.diffplug.spotless' version '8.11.0'
    id 'com.undefinedcreations.runServer' version '0.1.8'
}

group = 'com.playernguyen'

def projectVersion = providers.gradleProperty('version')
        .orElse(providers.environmentVariable('VERSION'))
        .map { it.trim() }
        .filter { it && it != 'unspecified' }
        .getOrElse('0.0.0-dev')
version = projectVersion

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-Xlint:-options')
}

tasks.named('compileJava', JavaCompile) {
    options.release = 8
}

tasks.named('compileTestJava', JavaCompile) {
    options.release = 17
}

repositories {
    mavenCentral()
    mavenLocal()

    maven {
        url = uri('https://repo.papermc.io/repository/maven-public/')
    }

    maven {
        url = uri('https://repo.extendedclip.com/content/repositories/placeholderapi/')
    }

    maven {
        url = uri('https://jitpack.io')
    }

    maven {
        url = uri('https://nexus.funkemunky.cc/content/repositories/releases/')
    }

    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots' }
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
}

dependencies {
    compileOnly 'com.google.code.gson:gson:2.8.6'
    compileOnly 'org.jetbrains:annotations:19.0.0'
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly 'com.destroystokyo.paper:paper-api:1.15.2-R0.1-SNAPSHOT'
    compileOnly 'com.github.brcdev-minecraft:shopgui-api:2.4.0'
    compileOnly('com.promcteam:bossshoppro:2.1.0-R2') {
        transitive = false
    }
    compileOnly 'be.maximvdw:MVdWPlaceholderAPI:2.5.1'

    implementation 'com.zaxxer:HikariCP:3.4.5'
    implementation 'org.xerial:sqlite-jdbc:3.42.0.0'
    implementation 'com.mysql:mysql-connector-j:8.0.33'

    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testImplementation 'com.github.seeseemelk:MockBukkit-v1.20:3.50.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
}

test {
    useJUnitPlatform {
        excludeTags 'soak'
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

/*
 * Opt-in lifecycle soak test. `test` excludes the `soak` tag, so this task is
 * the only way to run it. The small heap and JFR recording make a regression
 * easy to inspect with jcmd/JMC; the test itself asserts the plugin's internal
 * per-player counters, which is deterministic and CI-friendly.
 */
tasks.register('soakTest', Test) {
    description = 'Runs the opt-in lifecycle leak soak test'
    group = 'verification'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    dependsOn tasks.named('testClasses')

    useJUnitPlatform {
        includeTags 'soak'
    }

    maxHeapSize = '256m'
    jvmArgs(
            '-XX:+UseG1GC',
            '-XX:+HeapDumpOnOutOfMemoryError',
            '-XX:HeapDumpPath=build/reports/soak',
            '-XX:StartFlightRecording=filename=build/reports/soak/soak.jfr,settings=profile,dumponexit=true')
    systemProperty 'soak.iterations', providers.gradleProperty('soakIterations').getOrElse('150')
    systemProperty 'soak.players', providers.gradleProperty('soakPlayers').getOrElse('20')

    doFirst {
        layout.buildDirectory.dir('reports/soak').get().asFile.mkdirs()
    }

    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

spotbugs {
    toolVersion = '4.9.3'
    effort = 'max'
    reportLevel = 'medium'
    excludeFilter = file('config/spotbugs/exclude.xml')
}

tasks.withType(SpotBugsTask).configureEach {
    reports {
        html.required = true
        xml.required = true
    }
}

spotless {
    java {
        target 'src/**/*.java'
        palantirJavaFormat('2.68.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        mavenLocal()
    }
}

def versionTokens = ['VERSION': project.version]

processResources {
    inputs.property('version', project.version)

    filesMatching('plugin.yml') {
        filter(ReplaceTokens, tokens: versionTokens)
    }
}

jar {
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

/*
 * Local test server: `./gradlew runServer` builds the plugin jar and starts a
 * server with OptEco installed in `run/PURPUR/plugins`.
 *
 * Purpur (a Paper fork) is used because runServer 0.1.8 still downloads PaperMC
 * through the retired api.papermc.io v2 API, which now answers HTTP 410.
 */
tasks.named('runServer', RunServerTask) {
    serverType(ServerType.PURPUR)
    minecraftVersion('1.20.4')
    allowedRam(2, RamAmount.GIGABYTE)
    noGui(true)
    acceptMojangEula()
}
